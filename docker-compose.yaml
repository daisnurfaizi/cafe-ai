services:
  cafe-ai:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cafe-ai
    environment:
      - DATABASE_URL=mysql://cafe:cafeai2026@samrs-mysql:3306/cafe_ai
      - LITELLM_BASE_URL=http://cafe-litellm:4000
      - LITELLM_MASTER_KEY=sk-cafe-ai-master-key
      - NUXT_SESSION_SECRET=cafe-ai-session-secret-change-me-32-chars
    volumes:
      - ./litellm_config.yaml:/litellm_config.yaml:ro
    networks:
      - 9router
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: cafe-litellm
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=sk-cafe-ai-master-key
      - DATABASE_URL=postgresql://litellm:litellm2026@cafe-postgres:5432/litellm
    depends_on:
      - postgres
    networks:
      - 9router
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cafe-postgres
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm2026
      - POSTGRES_DB=litellm
    volumes:
      - cafe_pg_data:/var/lib/postgresql/data
    networks:
      - 9router
    restart: unless-stopped

volumes:
  cafe_pg_data:

networks:
  9router:
    external: true
